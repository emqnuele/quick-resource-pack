plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me/" } // Cloth Config
	maven { url "https://maven.terraformersmc.com/releases/" } // Mod Menu
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cloth Config
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Mod Menu (optional at runtime)
	compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"

	// Unit tests (JUnit 5, plain JVM, no game needed for core package)
	testImplementation platform("org.junit:junit-bom:5.11.3")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def mcVersionParts = project.minecraft_version.tokenize('.')
def mcMinorVersion = "${mcVersionParts[0]}.${mcVersionParts[1]}"

// restrict each jar to the minor line it was built for (e.g. 26.2 -> ">=26.2 <26.3")
def minecraftDependency = project.findProperty("minecraft_dependency")
		?: ">=${mcMinorVersion} <${mcVersionParts[0]}.${(mcVersionParts[1] as int) + 1}"

// version-specific shims for apis that moved between minor lines
def compatSourceDir = file("src/compat/${mcMinorVersion}/java")
if (!compatSourceDir.isDirectory()) {
	throw new GradleException("no compat sources for minecraft ${mcMinorVersion}: expected ${compatSourceDir}")
}
sourceSets.main.java.srcDir compatSourceDir

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "minecraft_dependency", minecraftDependency
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"minecraft_dependency": minecraftDependency,
				"loader_version": project.loader_version
	}
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"
	if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
		it.options.release.set(targetJavaVersion)
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.named('test', Test) {
	useJUnitPlatform()
	// Minecraft's log4j config writes logs/ into the working directory
	def testRun = layout.buildDirectory.dir("test-run").get().asFile
	doFirst { testRun.mkdirs() }
	workingDir = testRun
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

// Game-free logic lives under core and must stay importable without Minecraft:
// fail the build if it references the game, so unit tests never need to launch it.
def coreSources = fileTree("src/main/java") { include "**/core/**/*.java" }
tasks.register('checkCorePurity') {
	inputs.files coreSources
	doLast {
		def offenders = coreSources.files.findAll { it.text =~ /import\s+(static\s+)?(net\.minecraft|com\.mojang)\./ }
		if (offenders) {
			throw new GradleException("core must not import the game: ${offenders*.name.join(', ')}")
		}
	}
}

tasks.named('check') {
	dependsOn 'checkCorePurity'
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
